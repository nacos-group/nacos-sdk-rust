name: CI

on:
  push:
    branches:
      - main
      - release-*
    tags:
      - v*
  pull_request:
    branches:
      - main
      - release-*

env:
  CARGO_TERM_COLOR: always
  CARGO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Set sccache env
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
      - name: cargo fmt
        run: cargo fmt --all -- --check --color ${{ env.CARGO_TERM_COLOR }}
      - name: cargo clippy
        run: cargo clippy --all-features -- -D warnings
      - name: Print sccache stats
        if: always()
        run: sccache --show-stats

  integration-nacos:
    name: Integration Tests (Nacos ${{ matrix.version }})
    runs-on: ubuntu-latest
    needs: [lint, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: v2.5.4
            profile: "2.5.4"
          - version: v3.3.0
            profile: "3.3"
    services:
      nacos:
        image: nacos/nacos-server:${{ matrix.version }}
        env:
          MODE: standalone
          NACOS_AUTH_ENABLE: "false"
          NACOS_AUTH_ADMIN_ENABLE: "false"
          NACOS_AUTH_CONSOLE_ENABLE: "false"
          NACOS_AUTH_TOKEN: VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg=
          NACOS_AUTH_IDENTITY_KEY: nacos-test
          NACOS_AUTH_IDENTITY_VALUE: nacos-test
        ports:
          - 8848:8848
          - 9848:9848
          - 10848:8080
        options: >-
          --health-cmd "curl -f http://localhost:8848/nacos/v1/console/health/readiness || curl -f http://localhost:8080/v3/console/health/readiness"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Set sccache env
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
      - name: Wait for Nacos
        run: |
          echo "Waiting for Nacos ${{ matrix.version }} to be ready..."
          for i in {1..30}; do
            if curl -sf http://localhost:8848/nacos/v1/ns/operator/metrics > /dev/null 2>&1 \
              && { curl -sf http://localhost:8848/nacos/v1/console/health/readiness > /dev/null 2>&1 \
                || curl -sf http://localhost:10848/v3/console/health/readiness > /dev/null 2>&1; }; then
              echo "Nacos is ready"
              exit 0
            fi
            echo "Attempt $i/30: Nacos not ready yet..."
            sleep 2
          done
          echo "Timeout waiting for Nacos"
          exit 1
      - name: Run integration tests
        run: |
          cargo test --test it_config --test it_naming --features "config,naming" -- --include-ignored
        env:
          NACOS_SERVER: external
          NACOS_SERVER_PROFILE: ${{ matrix.profile }}
          NACOS_CONSOLE_PORT: "10848"
      - name: Run AI integration tests
        if: matrix.profile == '3.3'
        run: |
          cargo test --test it_ai --features "config,naming,ai" -- --include-ignored
        env:
          NACOS_SERVER: external
          NACOS_SERVER_PROFILE: ${{ matrix.profile }}
          NACOS_CONSOLE_PORT: "10848"
      - name: Run auth integration tests
        if: matrix.profile == '2.5.4'
        run: |
          cargo test --test it_auth --features "config,naming,auth-by-http" -- --include-ignored
        env:
          NACOS_SERVER: external
          NACOS_SERVER_PROFILE: ${{ matrix.profile }}
      - name: Print sccache stats
        if: always()
        run: sccache --show-stats

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Set sccache env
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build
      - name: Build examples
        run: cargo build --examples
      - name: Run Tests
        run: cargo test --lib --bins --all-features
      - name: Print sccache stats
        if: always()
        run: sccache --show-stats

  feature-matrix:
    name: Feature Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - "config"
          - "naming"
          - "config,naming"
          - "config,naming,tls"
          - "config,naming,auth-by-http"
          - "config,naming,auth-by-http,tls"
          - "config,naming,auth-by-aliyun"
          - "config,naming,ai"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Set sccache env
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
      - name: Build with features
        run: cargo build --features "${{ matrix.features }}"
      - name: Test with features
        run: cargo test --lib --bins --features "${{ matrix.features }}"
      - name: Print sccache stats
        if: always()
        run: sccache --show-stats

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [lint, build]
    if: startswith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4
      - name: cargo publish
        run: cargo publish --token ${{ env.CARGO_TOKEN }}
